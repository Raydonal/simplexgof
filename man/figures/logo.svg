<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 181 209" width="181" height="209">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#2c7bb6"/>
    </linearGradient>
    <clipPath id="hex">
      <polygon points="90.5,1 179,47.75 179,161.25 90.5,208 2,161.25 2,47.75"/>
    </clipPath>
  </defs>

  <!-- Hex background -->
  <polygon points="90.5,1 179,47.75 179,161.25 90.5,208 2,161.25 2,47.75"
           fill="url(#bgGrad)" stroke="#ffffff" stroke-width="3"/>

  <!-- Bootstrap density curve (white) -->
  <path d="M 25,145
           C 30,145 35,145 40,140
           C 48,132 52,115 58,105
           C 62,98  68,90  74,85
           C 82,78  88,85  90,98
           C 92,110 95,120 100,128
           C 105,136 112,142 118,138
           C 125,133 130,120 136,110
           C 142,100 148,98 155,100"
        fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5"
        stroke-dasharray="none"/>

  <!-- Observed Un vertical bar (red) -->
  <line x1="93" y1="75" x2="93" y2="150"
        stroke="#d7191c" stroke-width="3"/>

  <!-- Normal curve overlay (dashed, light) -->
  <path d="M 30,145
           C 40,145 50,144 60,138
           C 70,130 80,110 90,98
           C 100,86 110,82 118,88
           C 128,96 136,115 145,138
           C 150,143 155,145 160,145"
        fill="none" stroke="rgba(255,255,255,0.45)"
        stroke-width="1.8" stroke-dasharray="5,3"/>

  <!-- Un label -->
  <text x="96" y="90" font-family="Georgia, serif" font-size="14"
        fill="#d7191c" font-style="italic">U</text>
  <text x="104" y="93" font-family="Georgia, serif" font-size="9"
        fill="#d7191c">n</text>

  <!-- Package name -->
  <text x="90.5" y="175" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="700" fill="white"
        text-anchor="middle" letter-spacing="1">simplexgof</text>

  <!-- Hex border (overlay) -->
  <polygon points="90.5,1 179,47.75 179,161.25 90.5,208 2,161.25 2,47.75"
           fill="none" stroke="white" stroke-width="3"/>
</svg>
